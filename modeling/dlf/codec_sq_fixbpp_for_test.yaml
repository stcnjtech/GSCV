model:
  params:
    embed_dim: 64
    feat_dim: 768
    in_pos_enc: [3, 7, 11, 15, 19]
    in_pos_dec: [3, 7, 11, 15, 19]
    n_attn: 2
    no_attn_vqgan: False

    # titok config
    config:
      model:
          vq_model:
              codebook_size: 4096
              token_size: 12
              use_l2_norm: True
              commitment_cost: 0.25
              # vit arch
              vit_enc_model_size: "large"
              vit_dec_model_size: "large"
              vit_enc_patch_size: 16
              vit_dec_patch_size: 16
              num_latent_tokens: 32
      dataset:
          preprocessing:
              crop_size: 256

    # vqgan config
    vqganconfig:
      ignore_keys: [loss.discriminator]
      monitor: val/rec_loss
      embed_dim: 256
      n_embed: 256
      ddconfig:
        double_z: False
        z_channels: 256
        resolution: 256
        in_channels: 3
        out_ch: 3
        ch: 128
        ch_mult: [1,1,2,2,4]  # num_down = len(ch_mult)-1
        num_res_blocks: 2
        attn_resolutions: [16]
        dropout: 0.0
      lossconfig:
        target: modeling.dlf.src.taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
        params:
          disc_conditional: false
          disc_in_channels: 3
          disc_start: 9999999
          disc_weight: 0.75
          codebook_weight: 1.0

